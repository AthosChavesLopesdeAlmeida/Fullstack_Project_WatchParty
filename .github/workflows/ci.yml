name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (types, web build, compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: No .env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$' | grep -v '\.example$'; then
            echo "::error::A .env file is committed. Remove it from the repository."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Fails if package-lock.json is out of sync with the package.json files,
      # or if it lacks the Linux binaries (lightningcss, esbuild, oxide, swc).
      - name: Install dependencies
        run: npm ci

      # The backend runs with tsx in dev, and tsx does not check types.
      # This is the only place where backend type errors show up.
      - name: Type check workspaces
        run: |
          failed=0
          for dir in apps/api apps/ws-server apps/worker packages/db packages/queue packages/schemas; do
            if [ ! -f "$dir/tsconfig.json" ]; then
              echo "::notice::$dir has no tsconfig.json, skipped"
              continue
            fi
            echo "::group::tsc $dir"
            npx tsc --noEmit -p "$dir" || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # next build also type checks the web app.
      - name: Build web
        run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3333/api
          NEXT_PUBLIC_WS_URL: ws://localhost:3334

      # The .env files are not in the repository, so empty ones stand in.
      - name: Validate docker-compose.yml
        run: |
          touch apps/api/.env apps/ws-server/.env apps/worker/.env
          docker compose config --quiet

  docker:
    name: Docker build (${{ matrix.target }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
          - target: ws-server
          - target: worker
          - target: web
            build_args: |
              NEXT_PUBLIC_API_URL=http://localhost:3333/api
              NEXT_PUBLIC_WS_URL=ws://localhost:3334
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # push: false -> the image is built to prove it builds, and then discarded.
      # Publishing the images is a later phase.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}